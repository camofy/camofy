[package]
name = "camofy"
version = "0.1.2"
edition = "2024"
autobins = false
default-run = "camofy-cloud"

[[bin]]
name = "camofy-cloud"
path = "src/cloud/main.rs"
required-features = ["cloud"]

[[bin]]
name = "camofy-agent"
path = "src/agent/main.rs"
required-features = ["agent"]

[features]
default = ["cloud"]
cloud = ["dep:axum", "dep:sqlx", "dep:argon2", "dep:rand_core", "dep:tower-http", "dep:aes-gcm", "dep:tokio-rustls", "dep:webpki-roots", "dep:futures-util", "dep:hmac"]
agent = ["dep:tokio-tungstenite", "dep:futures-util", "dep:axum"]

[dependencies]
axum = { version = "0.7", features = ["json", "ws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync", "io-util", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "socks"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = { version = "0.5", default-features = false, features = ["password-hash", "std"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
fs2 = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "migrate", "macros"], optional = true }
tower-http = { version = "0.6", features = ["fs", "set-header"], optional = true }
aes-gcm = { version = "0.10", optional = true }
sha2 = "0.10"
hmac = { version = "0.12", optional = true }
base64 = "0.22"
url = "2"
anyhow = "1"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
percent-encoding = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", features = ["sink"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true  # 自动剥离符号表和调试信息，减小体积
panic = "abort"  # 去掉 unwinding 支持，进一步减小体积
