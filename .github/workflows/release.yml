name: Build cloud and headless agent
on:
  push:
    tags: ["v*"]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      include_probe:
        description: Build the temporary on-device proxy verification tool
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            binary: camofy-cloud
            features: cloud
          - target: x86_64-unknown-linux-musl
            binary: camofy-agent
            features: agent
          - target: armv7-unknown-linux-musleabihf
            binary: camofy-agent
            features: agent
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
        working-directory: web
        if: matrix.binary == 'camofy-cloud'
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo install cross --locked
      - run: cross build --release --locked --no-default-features --features ${{ matrix.features }} --bin ${{ matrix.binary }} --target ${{ matrix.target }}
      - name: Build optional proxy probe
        if: matrix.binary == 'camofy-agent' && (inputs.include_probe || matrix.target == 'armv7-unknown-linux-musleabihf')
        run: |
          cross build --release --locked --no-default-features --features agent --example proxy-probe --target ${{ matrix.target }}
          mkdir -p probe
          cp target/${{ matrix.target }}/release/examples/proxy-probe probe/
          cd probe && sha256sum proxy-probe > proxy-probe.sha256
      - uses: actions/upload-artifact@v4
        if: matrix.binary == 'camofy-agent' && (inputs.include_probe || matrix.target == 'armv7-unknown-linux-musleabihf')
        with:
          name: proxy-probe-${{ matrix.target }}
          path: probe/
      - name: Package
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} package/
          if [ "${{ matrix.binary }}" = "camofy-cloud" ]; then mkdir -p package/web; cp -r web/dist package/web/; fi
          tar -czf ${{ matrix.binary }}-${{ matrix.target }}.tar.gz -C package .
          sha256sum ${{ matrix.binary }}-${{ matrix.target }}.tar.gz > ${{ matrix.binary }}-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
