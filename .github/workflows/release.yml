name: Build cloud and headless agent
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            binary: camofy-cloud
            features: cloud
          - target: x86_64-unknown-linux-musl
            binary: camofy-agent
            features: agent
          - target: armv7-unknown-linux-musleabihf
            binary: camofy-agent
            features: agent
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
        working-directory: web
        if: matrix.binary == 'camofy-cloud'
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo install cross --locked
      - run: cross build --release --locked --no-default-features --features ${{ matrix.features }} --bin ${{ matrix.binary }} --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} package/
          if [ "${{ matrix.binary }}" = "camofy-cloud" ]; then mkdir -p package/web; cp -r web/dist package/web/; fi
          tar -czf ${{ matrix.binary }}-${{ matrix.target }}.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.target }}
          path: "*.tar.gz"
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
